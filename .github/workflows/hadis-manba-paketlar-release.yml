# Bir martalik: paketlarni GitHub Release'ga yuklaydi (keyingi commitda paketlar va bu fayl olib tashlanadi).
# Teg main commitiga qo'yiladi — paketlar git tarixiga (main) kirmaydi.
name: hadis-manba-paketlar-release
on:
  push:
    branches: ["claude/new-session-f9jsvi"]
    paths: ["hadis-manba-paketlar/**"]
permissions:
  contents: write
env:
  TAG: hadis-manba-paketlar-v1
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xeshlarni tekshirish
        run: cd hadis-manba-paketlar/paketlar && sha256sum -c SHA256SUMS
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main \
            --title "Hadis Manba — 17 books + 15 commentaries (offline packages)" \
            --notes-file hadis-manba-paketlar/RELEASE-NOTES.md \
            hadis-manba-paketlar/paketlar/*.hmz hadis-manba-paketlar/paketlar/SHA256SUMS hadis-manba-paketlar/paketlar/RIGHTS-PAKETLAR.md
      - name: Yuklangan fayllarni qayta tekshirish va CORS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/q && cd /tmp/q
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          sha256sum -c SHA256SUMS
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name|endswith(".hmz")) | .id' | head -1)
          echo "asset id: $id"
          curl -sS -L -D - -o /tmp/q/a.bin -H "Origin: https://nbeast19.github.io" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" | grep -iE "^HTTP|^access-control-allow-origin|^location" | sed 's/\?.*//'
          curl -sS -D - -o /dev/null -H "Origin: https://nbeast19.github.io" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS" | grep -iE "^HTTP|^access-control-allow-origin" || true
