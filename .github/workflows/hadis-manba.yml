name: hadis-manba

on:
  push:
    paths: ["hadis-manba-platformasi/**", ".github/workflows/hadis-manba.yml"]
  pull_request:
    paths: ["hadis-manba-platformasi/**", ".github/workflows/hadis-manba.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hadis-manba-platformasi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python bog'liqliklari
        run: python -m pip install ".[test]"
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Barcha sinovlar
        env:
          NODE_PATH: ${{ github.workspace }}/hadis-manba-platformasi/node_modules
        run: sh scripts/verify.sh
      - name: Ommaviy katalogda faqat allowlist paketlari
        run: |
          python - <<'PY'
          import json
          c = json.load(open("web/catalog.json"))
          assert all(p["channel"] == "public" for p in c["packages"]), c
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-natija
          path: hadis-manba-platformasi/build/e2e-natija.json
